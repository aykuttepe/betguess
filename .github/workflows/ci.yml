# Quality gates B/C/D (docs/QUALITY-GATES.md). Never deploys.
# Lint is not configured yet: Gate B stays "not passed" until a real lint script exists.
name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server — typecheck, build, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    env:
      # whatsapp-web.js pulls Puppeteer; tests never launch a browser.
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
      - name: Test
        run: npm test

  client:
    name: Client — typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - name: Typecheck and build
        run: npm run build

  secret-scan:
    name: Secret scan (gitleaks, full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        package: [server, client]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Audit gate self-test
        run: node --test scripts/audit-gate.test.mjs
      # Blocking: fails on any high/critical production advisory not accepted, unexpired,
      # in security/audit-exceptions.json. Full report kept below for context.
      - name: npm audit gate (high and critical)
        run: node scripts/audit-gate.mjs ${{ matrix.package }}
      - name: npm audit full report
        if: always()
        working-directory: ${{ matrix.package }}
        run: npm audit --omit=dev || true
